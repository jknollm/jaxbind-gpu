[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.13", "jaxlib>=0.11.2,<0.12"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxbind-gpu"
version = "0.1.0"
description = "Bind external CUDA operations to JAX with custom derivatives and batching"
readme = "docs/package.md"
requires-python = ">=3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{name = "jaxbind-gpu contributors"}]
keywords = ["jax", "cuda", "gpu", "autodiff", "ffi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = ["jax>=0.11.2,<0.12", "jaxlib>=0.11.2,<0.12", "numpy>=2.1"]

[project.urls]
Source = "https://github.com/jknollm/jaxbind-gpu"
Documentation = "https://github.com/jknollm/jaxbind-gpu/tree/main/docs"
Issues = "https://github.com/jknollm/jaxbind-gpu/issues"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.11.2,<0.12", "cupy-cuda12x>=13"]
demos = ["cufinufft>=2.4,<3", "pybind11>=2.13", "scipy>=1.14"]
test = ["pytest>=8", "flatbuffers>=24"]
reference = ["jax-finufft>=1.3.1,<2"]
applications = ["scipy>=1.14"]
warp = ["warp-lang>=1.18,<2"]
release = ["build>=1.2", "twine>=6", "auditwheel>=6.8.2", "patchelf>=0.17"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["jaxbind_gpu*"]
namespaces = false

[tool.setuptools.package-data]
jaxbind_gpu = ["include/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = [".references", ".torch-benchmark"]
